<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIG DICE // 네온 주사위 배틀</title>
<style>
* {
  box-sizing: border-box;
}

:root {
  --neon-cyan: #00fff2;
  --neon-pink: #ff2fd6;
  --neon-gold: #ffd23f;
  --bg-dark: #05060a;
}

html, body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
  color: #f5f5f5;
  background: var(--bg-dark);
}

#bg {
  position: fixed;
  inset: 0;
  z-index: 0;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 12px;
}

.game-container {
  position: relative;
  z-index: 1;
  width: min(640px, 94vw);
  background: rgba(15, 17, 26, 0.72);
  backdrop-filter: blur(14px);
  border-radius: 24px;
  padding: 30px 26px 36px;
  border: 1px solid rgba(0, 255, 242, 0.25);
  box-shadow:
    0 0 40px rgba(0, 255, 242, 0.15),
    0 0 80px rgba(255, 47, 214, 0.08),
    inset 0 0 60px rgba(0, 0, 0, 0.4);
  text-align: center;
}

.title-wrap {
  margin-bottom: 10px;
}

.glitch {
  font-size: 2.6rem;
  font-weight: 900;
  letter-spacing: 6px;
  margin: 0;
  color: #fff;
  text-shadow:
    0 0 10px var(--neon-cyan),
    0 0 25px var(--neon-cyan),
    0 0 45px rgba(0,255,242,0.5);
  position: relative;
}

.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  left: 0; right: 0;
  top: 0;
  opacity: 0.7;
}

.glitch::before {
  color: var(--neon-pink);
  animation: glitchTop 3.5s infinite linear alternate-reverse;
  clip-path: inset(0 0 60% 0);
}

.glitch::after {
  color: var(--neon-gold);
  animation: glitchBottom 2.7s infinite linear alternate-reverse;
  clip-path: inset(60% 0 0 0);
}

@keyframes glitchTop {
  0% { transform: translate(0,0); }
  20% { transform: translate(-2px,-1px); }
  40% { transform: translate(2px,1px); }
  60% { transform: translate(-1px,1px); }
  80% { transform: translate(1px,-1px); }
  100% { transform: translate(0,0); }
}

@keyframes glitchBottom {
  0% { transform: translate(0,0); }
  25% { transform: translate(2px,1px); }
  50% { transform: translate(-2px,-1px); }
  75% { transform: translate(1px,-2px); }
  100% { transform: translate(0,0); }
}

.subtitle {
  margin: 6px 0 18px;
  font-size: 0.78rem;
  letter-spacing: 3px;
  color: var(--neon-cyan);
  opacity: 0.8;
  text-transform: uppercase;
}

.rule {
  font-size: 0.85rem;
  color: #9aa5b1;
  line-height: 1.6;
  margin-bottom: 24px;
}

.hl {
  color: var(--neon-gold);
  font-weight: 700;
  text-shadow: 0 0 8px rgba(255,210,63,0.6);
}

.players {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 26px;
}

.vs {
  font-weight: 900;
  font-size: 1.1rem;
  color: var(--neon-pink);
  text-shadow: 0 0 12px var(--neon-pink);
  letter-spacing: 2px;
}

.player-card {
  position: relative;
  flex: 1;
  background: linear-gradient(160deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  border-radius: 18px;
  padding: 18px 10px;
  border: 1px solid rgba(255,255,255,0.08);
  transition: border-color 0.35s, transform 0.35s, box-shadow 0.35s;
  overflow: hidden;
}

.player-card.active {
  border-color: var(--neon-cyan);
  transform: translateY(-6px) scale(1.03);
  box-shadow: 0 0 25px rgba(0,255,242,0.35), 0 0 50px rgba(0,255,242,0.15);
}

.player-card.active .glow-ring {
  opacity: 1;
}

.glow-ring {
  position: absolute;
  inset: -40%;
  background: conic-gradient(from 0deg, transparent, var(--neon-cyan), transparent 30%);
  opacity: 0;
  animation: spin 3s linear infinite;
  transition: opacity 0.35s;
  z-index: 0;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.player-card h2,
.player-card .total-score {
  position: relative;
  z-index: 1;
}

.player-card.winner {
  border-color: var(--neon-gold);
  box-shadow: 0 0 35px rgba(255,210,63,0.55);
  animation: pulseWin 1.1s ease-in-out infinite alternate;
}

@keyframes pulseWin {
  from { box-shadow: 0 0 25px rgba(255,210,63,0.4); }
  to { box-shadow: 0 0 45px rgba(255,210,63,0.8); }
}

.player-card h2 {
  margin: 0 0 10px;
  font-size: 0.85rem;
  letter-spacing: 2px;
  color: #c5c6c7;
}

.total-score {
  font-size: 2.2rem;
  font-weight: 900;
  color: var(--neon-cyan);
  text-shadow: 0 0 15px rgba(0,255,242,0.5);
}

.middle {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.dice-stage {
  perspective: 800px;
  width: 90px;
  height: 90px;
  margin-bottom: 4px;
}

.dice {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transform: rotateX(-20deg) rotateY(30deg);
  transition: transform 0.15s linear;
}

.dice.rolling {
  animation: tumble 0.5s linear infinite;
}

@keyframes tumble {
  0% { transform: rotateX(0deg) rotateY(0deg); }
  100% { transform: rotateX(360deg) rotateY(360deg); }
}

.face {
  position: absolute;
  width: 90px;
  height: 90px;
  background: linear-gradient(145deg, #1b1f2a, #0d0f16);
  border: 1px solid rgba(0,255,242,0.4);
  border-radius: 14px;
  box-shadow: inset 0 0 20px rgba(0,255,242,0.15), 0 0 20px rgba(0,255,242,0.25);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  padding: 14px;
}

.face::before {
  content: '';
}

.face.front  { transform: translateZ(45px); }
.face.back   { transform: rotateY(180deg) translateZ(45px); }
.face.right  { transform: rotateY(90deg) translateZ(45px); }
.face.left   { transform: rotateY(-90deg) translateZ(45px); }
.face.top    { transform: rotateX(90deg) translateZ(45px); }
.face.bottom { transform: rotateX(-90deg) translateZ(45px); }

.pip {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--neon-gold);
  box-shadow: 0 0 8px var(--neon-gold);
  align-self: center;
  justify-self: center;
}

.turn-score {
  font-size: 1rem;
  letter-spacing: 2px;
  color: #e0e0e0;
}

#turnScore {
  color: var(--neon-pink);
  font-weight: 900;
  font-size: 1.3rem;
  text-shadow: 0 0 10px rgba(255,47,214,0.6);
}

.buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  position: relative;
  border: none;
  padding: 13px 26px;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 800;
  letter-spacing: 2px;
  cursor: pointer;
  color: #05060a;
  transition: transform 0.15s, box-shadow 0.2s, opacity 0.15s;
  overflow: hidden;
}

button span {
  position: relative;
  z-index: 1;
}

#rollBtn { background: linear-gradient(135deg, var(--neon-cyan), #00b3a6); box-shadow: 0 0 18px rgba(0,255,242,0.5); }
#holdBtn { background: linear-gradient(135deg, var(--neon-pink), #b5009e); color: #fff; box-shadow: 0 0 18px rgba(255,47,214,0.5); }
#resetBtn { background: linear-gradient(135deg, #9aa5b1, #4b5563); box-shadow: 0 0 12px rgba(255,255,255,0.15); }

button:hover:not(:disabled) {
  transform: translateY(-2px);
}

button:active:not(:disabled) {
  transform: scale(0.94);
}

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.message {
  min-height: 24px;
  font-size: 0.95rem;
  color: var(--neon-gold);
  font-weight: 700;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255,210,63,0.4);
}

.rolls-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 0.7rem;
  letter-spacing: 2px;
  color: #9aa5b1;
}

.pips-track {
  display: flex;
  gap: 8px;
}

.pips-track .roll-pip {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  transition: background 0.25s, box-shadow 0.25s, transform 0.25s;
}

.pips-track .roll-pip.used {
  background: var(--neon-pink);
  box-shadow: 0 0 10px var(--neon-pink);
  transform: scale(0.85);
}

.effect-banner {
  min-height: 26px;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: 2px;
  opacity: 0;
  transform: scale(0.7);
  transition: opacity 0.2s, transform 0.2s;
}

.effect-banner.show-mult {
  opacity: 1;
  transform: scale(1.1);
  color: var(--neon-gold);
  text-shadow: 0 0 14px rgba(255,210,63,0.8);
}

.effect-banner.show-div {
  opacity: 1;
  transform: scale(1.1);
  color: var(--neon-pink);
  text-shadow: 0 0 14px rgba(255,47,214,0.8);
}

.effect-banner.show-bust {
  opacity: 1;
  transform: scale(1.1);
  color: #ff5050;
  text-shadow: 0 0 14px rgba(255,80,80,0.8);
}

</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="game-container">
  <div class="title-wrap">
    <h1 class="glitch" data-text="PIG DICE">PIG DICE</h1>
    <p class="subtitle">NEON DICE BATTLE · 100점을 먼저 채워라</p>
  </div>

  <p class="rule">한 턴에 주사위는 최대 <span class="hl">5번</span>까지! <span class="hl">1</span>이 나오면 이번 턴 점수 전부 증발,
  <span class="hl">6</span>이 나오면 턴 점수가 <span class="hl">×2</span> 폭발, <span class="hl">3</span>이 나오면 턴 점수가 <span class="hl">÷2</span> 페널티!
  <span class="hl">HOLD</span>로 점수를 확정하고 턴을 넘기세요. 5번을 다 쓰면 자동으로 저장됩니다. 먼저 <span class="hl">100</span>에 도달하면 승리!</p>

  <div class="players">
    <div class="player-card" id="player1-card">
      <div class="glow-ring"></div>
      <h2>PLAYER 1</h2>
      <div class="total-score" id="score1">0</div>
    </div>
    <div class="vs">VS</div>
    <div class="player-card" id="player2-card">
      <div class="glow-ring"></div>
      <h2>PLAYER 2</h2>
      <div class="total-score" id="score2">0</div>
    </div>
  </div>

  <div class="middle">
    <div class="dice-stage">
      <div class="dice" id="dice">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="face right"></div>
        <div class="face left"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
      </div>
    </div>

    <div class="turn-score">
      TURN SCORE <span id="turnScore">0</span>
    </div>

    <div class="rolls-left">
      ROLLS LEFT
      <div class="pips-track" id="rollsLeft"></div>
    </div>

    <div class="effect-banner" id="effectBanner"></div>

    <div class="buttons">
      <button id="rollBtn"><span>ROLL</span></button>
      <button id="holdBtn"><span>HOLD</span></button>
      <button id="resetBtn"><span>RESET</span></button>
    </div>

    <div class="message" id="message">PLAYER 1의 차례입니다.</div>
  </div>
</div>
<script>
const WIN_SCORE = 100;
const MAX_ROLLS_PER_TURN = 5;

// 각 눈금(1~6)에 대한 점(pip) 위치 패턴 (3x3 그리드 기준 grid-area 좌표)
const PIP_PATTERNS = {
  1: [[2,2]],
  2: [[1,1],[3,3]],
  3: [[1,1],[2,2],[3,3]],
  4: [[1,1],[1,3],[3,1],[3,3]],
  5: [[1,1],[1,3],[2,2],[3,1],[3,3]],
  6: [[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]
};

let scores = [0, 0];
let currentPlayer = 0;
let turnScore = 0;
let rollsUsed = 0;
let gameOver = false;
let rolling = false;

const scoreEls = [document.getElementById('score1'), document.getElementById('score2')];
const cardEls = [document.getElementById('player1-card'), document.getElementById('player2-card')];
const diceEl = document.getElementById('dice');
const turnScoreEl = document.getElementById('turnScore');
const messageEl = document.getElementById('message');
const effectBannerEl = document.getElementById('effectBanner');
const rollsLeftEl = document.getElementById('rollsLeft');
const rollBtn = document.getElementById('rollBtn');
const holdBtn = document.getElementById('holdBtn');
const resetBtn = document.getElementById('resetBtn');

const faceEls = {
  front: diceEl.querySelector('.front'),
  back: diceEl.querySelector('.back'),
  right: diceEl.querySelector('.right'),
  left: diceEl.querySelector('.left'),
  top: diceEl.querySelector('.top'),
  bottom: diceEl.querySelector('.bottom')
};

// 각 면에 임의의 눈금을 배정해 입체감 있게 렌더링
function renderFace(faceEl, value) {
  faceEl.innerHTML = '';
  const pattern = PIP_PATTERNS[value];
  for (const [row, col] of pattern) {
    const pip = document.createElement('div');
    pip.className = 'pip';
    pip.style.gridRow = row;
    pip.style.gridColumn = col;
    faceEl.appendChild(pip);
  }
}

function renderAllFaces(mainValue) {
  const others = [1,2,3,4,5,6].filter(v => v !== mainValue);
  renderFace(faceEls.front, mainValue);
  renderFace(faceEls.back, others[0]);
  renderFace(faceEls.right, others[1]);
  renderFace(faceEls.left, others[2]);
  renderFace(faceEls.top, others[3]);
  renderFace(faceEls.bottom, others[4]);
}

function renderRollsLeft() {
  rollsLeftEl.innerHTML = '';
  for (let i = 0; i < MAX_ROLLS_PER_TURN; i++) {
    const pip = document.createElement('div');
    pip.className = 'roll-pip' + (i < rollsUsed ? ' used' : '');
    rollsLeftEl.appendChild(pip);
  }
}

function updateUI() {
  scoreEls[0].textContent = scores[0];
  scoreEls[1].textContent = scores[1];
  cardEls.forEach((el, i) => {
    el.classList.toggle('active', i === currentPlayer && !gameOver);
  });
  turnScoreEl.textContent = turnScore;
  renderRollsLeft();
}

function setMessage(text) {
  messageEl.textContent = text;
}

function showEffect(text, type) {
  effectBannerEl.textContent = text;
  effectBannerEl.className = 'effect-banner ' + type;
  clearTimeout(showEffect._t);
  showEffect._t = setTimeout(() => {
    effectBannerEl.className = 'effect-banner';
  }, 1200);
}

function rollDice() {
  if (gameOver || rolling) return;
  rolling = true;
  rollBtn.disabled = true;
  holdBtn.disabled = true;
  diceEl.classList.add('rolling');

  let ticks = 0;
  const maxTicks = 12;
  const interval = setInterval(() => {
    const randomFace = Math.floor(Math.random() * 6) + 1;
    renderAllFaces(randomFace);
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(interval);
      finishRoll();
    }
  }, 70);
}

// 특수 효과 규칙:
// 1  -> 이번 턴 점수 전부 증발 (BUST), 턴 즉시 종료
// 6  -> 이번 턴 점수 x2 폭발
// 3  -> 이번 턴 점수 ÷2 페널티 (내림)
// 2,4,5 -> 그대로 더함
function finishRoll() {
  const value = Math.floor(Math.random() * 6) + 1;
  diceEl.classList.remove('rolling');
  renderAllFaces(value);
  rolling = false;
  rollsUsed++;

  if (value === 1) {
    turnScore = 0;
    showEffect('💥 BUST!', 'show-bust');
    setMessage(`꽝! 1이 나와 이번 턴 점수를 모두 잃었습니다. 플레이어 ${currentPlayer + 1}의 턴이 끝납니다.`);
    updateUI();
    rollBtn.disabled = false;
    holdBtn.disabled = false;
    setTimeout(switchPlayer, 1000);
    return;
  }

  if (value === 6) {
    turnScore = turnScore === 0 ? 6 : turnScore * 2;
    showEffect('✕2 폭발!', 'show-mult');
    setMessage(`6이 나와 턴 점수가 두 배가 되었습니다!`);
  } else if (value === 3) {
    turnScore = Math.floor(turnScore / 2);
    showEffect('÷2 페널티', 'show-div');
    setMessage(`3이 나와 턴 점수가 절반으로 줄었습니다...`);
  } else {
    turnScore += value;
    setMessage(`${value}가 나왔습니다! 계속 굴리거나 점수를 저장하세요.`);
  }

  updateUI();

  if (rollsUsed >= MAX_ROLLS_PER_TURN) {
    setMessage(`5번의 굴림을 모두 사용했습니다. 턴 점수가 자동으로 저장됩니다.`);
    rollBtn.disabled = true;
    holdBtn.disabled = true;
    setTimeout(() => bankScore(true), 1000);
    return;
  }

  rollBtn.disabled = false;
  holdBtn.disabled = false;
}

function holdScore() {
  if (gameOver || rolling) return;
  bankScore(false);
}

function bankScore(forced) {
  scores[currentPlayer] += turnScore;
  const bankedAmount = turnScore;
  turnScore = 0;
  updateUI();

  if (scores[currentPlayer] >= WIN_SCORE) {
    gameOver = true;
    cardEls[currentPlayer].classList.add('winner');
    cardEls[currentPlayer].classList.remove('active');
    setMessage(`🏆 플레이어 ${currentPlayer + 1} 승리! 최종 점수: ${scores[currentPlayer]}`);
    rollBtn.disabled = true;
    holdBtn.disabled = true;
    return;
  }

  if (!forced) {
    setMessage(`플레이어 ${currentPlayer + 1}이(가) ${bankedAmount}점을 저장했습니다. 다음 플레이어 차례입니다.`);
  }
  switchPlayer();
}

function switchPlayer() {
  currentPlayer = 1 - currentPlayer;
  turnScore = 0;
  rollsUsed = 0;
  renderAllFaces(1);
  updateUI();
  rollBtn.disabled = false;
  holdBtn.disabled = false;
  if (!gameOver) {
    setMessage(`플레이어 ${currentPlayer + 1}의 차례입니다.`);
  }
}

function resetGame() {
  scores = [0, 0];
  currentPlayer = 0;
  turnScore = 0;
  rollsUsed = 0;
  gameOver = false;
  rolling = false;
  renderAllFaces(1);
  diceEl.classList.remove('rolling');
  rollBtn.disabled = false;
  holdBtn.disabled = false;
  effectBannerEl.className = 'effect-banner';
  cardEls.forEach(el => el.classList.remove('winner', 'active'));
  updateUI();
  setMessage('플레이어 1의 차례입니다.');
  cardEls[0].classList.add('active');
}

rollBtn.addEventListener('click', rollDice);
holdBtn.addEventListener('click', holdScore);
resetBtn.addEventListener('click', resetGame);

// ---- 배경 파티클 캔버스 (사이버펑크 느낌의 떠다니는 네온 입자) ----
(function initBackground() {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let w, h, particles;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function createParticles() {
    particles = Array.from({ length: 60 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.4 + 0.1,
      hue: Math.random() > 0.5 ? '0,255,242' : '255,47,214'
    }));
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);
    for (const p of particles) {
      p.y -= p.speed;
      if (p.y < 0) p.y = h;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.hue}, 0.6)`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = `rgba(${p.hue}, 0.8)`;
      ctx.fill();
    }
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => {
    resize();
    createParticles();
  });

  resize();
  createParticles();
  animate();
})();

updateUI();
renderAllFaces(1);
cardEls[0].classList.add('active');

</script>
</body>
</html>
